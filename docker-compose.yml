services:
  db:
    image: postgres:16-alpine
    container_name: dental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental_care
    ports:
      - "5432:5432"
    volumes:
      - dental_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_care"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: dental-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dental:dental@db:5432/dental_care
      PORT: "4000"
      WEB_ORIGIN: http://localhost:8081
      NODE_ENV: production
    ports:
      - "4000:4000"

volumes:
  dental_pg_data:
    driver: local
